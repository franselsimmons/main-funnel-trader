services:
  - type: web
    name: ninetyvale-engine
    runtime: image
    autoDeployTrigger: off
    image:
      url: docker.io/ninetyvale/ninetyvale-engine@sha256:63bac4418c4703104c4314822f7e338a2e996705ed5e71f9e0834f5638936505
    healthCheckPath: /api/heartbeat
    envVars:
      - key: NINETYVALE_REDIS_URL
        fromService:
          type: keyvalue
          name: ninetyvale-kv-free-2
          property: connectionString
      - key: INTERNAL_SCHEDULER_ENABLED
        value: "true"
