services:
  - type: web
    name: ninetyvale-engine
    runtime: image
    autoDeployTrigger: off
    image:
      url: docker.io/ninetyvale/ninetyvale-engine@sha256:afddb5ce50fb4846f1ee5d79e171d437b1c274beb7c3b925928bca22439f3688
    healthCheckPath: /api/heartbeat
    envVars:
      - key: NINETYVALE_REDIS_URL
        fromService:
          type: keyvalue
          name: ninetyvale-kv-free-2
          property: connectionString
      - key: INTERNAL_SCHEDULER_ENABLED
        value: "true"
