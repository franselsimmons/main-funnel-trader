services:
  - type: web
    name: ninetyvale-engine
    runtime: image
    autoDeployTrigger: off
    image:
      url: docker.io/ninetyvale/ninetyvale-engine@sha256:f77f27877d0cc48b9fab1756801ad853d02ef6aa4df7074500b94ca4fc797b91
    healthCheckPath: /api/heartbeat
    envVars:
      - key: NINETYVALE_REDIS_URL
        fromService:
          type: keyvalue
          name: ninetyvale-kv-free-2
          property: connectionString
      - key: INTERNAL_SCHEDULER_ENABLED
        value: "true"
