services:
  - type: web
    name: ninetyvale-engine
    runtime: image
    autoDeployTrigger: off
    image:
      url: docker.io/ninetyvale/ninetyvale-engine@sha256:7e10804797e2f39c3897355f187b104d28ab948f3f587d4a9b3e0c200e187bd3
    healthCheckPath: /api/heartbeat
    envVars:
      - key: NINETYVALE_REDIS_URL
        fromService:
          type: keyvalue
          name: ninetyvale-kv-free-2
          property: connectionString
      - key: INTERNAL_SCHEDULER_ENABLED
        value: "true"
